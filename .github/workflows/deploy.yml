name: Deploy aashirwad_resturant

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_saved_menu:
        description: Deploy the saved menu without fetching Google Sheets
        type: boolean
        default: false

concurrency:
  group: aashirwad-resturant-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update static menu and images from private sheet
        if: ${{ inputs.use_saved_menu != true }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ] || [ -n "$GOOGLE_OAUTH_TOKEN_JSON" ]; then
            python scripts/update.py
          else
            echo "Notice: Neither GOOGLE_SERVICE_ACCOUNT_JSON nor GOOGLE_OAUTH_TOKEN_JSON was provided."
            echo "Deploying committed site/ menu files directly."
          fi
      - name: Commit generated menu and images
        if: ${{ inputs.use_saved_menu != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p site/assets/sheet
          git add site/menu.json site/menu-snapshot.js site/assets/sheet
          if ! git diff --cached --quiet; then
            git commit -m "Update menu from private sheet [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
